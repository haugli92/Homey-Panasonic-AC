<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panasonic AC (IR)</title>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding: 20px; }
    h1 { font-size: 1.2em; margin: 0 0 4px; }
    p.hint { color: #888; margin: 0 0 20px; font-size: 0.9em; }
    .row { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    select { width: 100%; padding: 10px; font-size: 1em; border-radius: 8px; }
    #status { margin-top: 8px; font-size: 0.9em; color: #2e7d32; min-height: 1.2em; }
    #devices p.empty { color: #888; }
  </style>
</head>
<body>
  <h1>Room temperature</h1>
  <p class="hint">
    For each air conditioner, pick a device whose temperature should be shown on
    it (current&nbsp;→&nbsp;target). Leave as “None” to show no room temperature.
  </p>

  <div id="devices"><p class="empty">Loading…</p></div>
  <div id="status"></div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const root = document.getElementById('devices');
      const statusEl = document.getElementById('status');
      let sources = {};

      function api(path) {
        return new Promise((resolve, reject) => {
          Homey.api('GET', path, null, (err, res) => (err ? reject(err) : resolve(res)));
        });
      }
      function getSources() {
        return new Promise((resolve) => {
          Homey.get('sources', (err, val) => resolve(err ? {} : (val || {})));
        });
      }
      function save() {
        Homey.set('sources', sources, (err) => {
          if (err) return Homey.alert(err.message || String(err));
          statusEl.textContent = 'Saved';
          setTimeout(() => { statusEl.textContent = ''; }, 2000);
        });
      }
      function label(sensor) {
        return sensor.zone ? sensor.name + ' — ' + sensor.zone : sensor.name;
      }

      function render(acs, sensors) {
        root.innerHTML = '';
        if (!acs.length) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'No air conditioners have been added yet.';
          root.appendChild(p);
          return;
        }
        acs.forEach((ac) => {
          const row = document.createElement('div');
          row.className = 'row';
          const lbl = document.createElement('label');
          lbl.textContent = ac.name;
          const sel = document.createElement('select');

          const none = document.createElement('option');
          none.value = '';
          none.textContent = '— None —';
          sel.appendChild(none);

          sensors.forEach((s) => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = label(s);
            if (sources[ac.id] === s.id) opt.selected = true;
            sel.appendChild(opt);
          });

          sel.addEventListener('change', () => {
            if (sel.value) sources[ac.id] = sel.value;
            else delete sources[ac.id];
            save();
          });

          row.appendChild(lbl);
          row.appendChild(sel);
          root.appendChild(row);
        });
      }

      Promise.all([api('/ac-devices'), api('/sensors'), getSources()])
        .then(([acs, sensors, src]) => {
          sources = src || {};
          render(acs, sensors);
          Homey.ready();
        })
        .catch((err) => {
          root.innerHTML = '';
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'Error loading devices.';
          root.appendChild(p);
          Homey.alert(err.message || String(err));
          Homey.ready();
        });
    }
  </script>
</body>
</html>
